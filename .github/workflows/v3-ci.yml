name: V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'architecture/**']

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build and Drizzle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Drizzle schema check
        run: npm run db:check
