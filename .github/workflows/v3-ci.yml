name: V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:check
