name: V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript build and Drizzle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install native build dependencies
        run: |
          # The hosted runner includes a Google Chrome APT source which can
          # occasionally serve a stale Packages index. It is not required by
          # this build, so exclude it from APT operations.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Drizzle schema check
        run: npm run db:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --omit=optional --no-audit --no-fund
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --legacy-peer-deps --omit=optional --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
