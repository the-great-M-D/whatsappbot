name: V3 Dashboard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'architecture/**']

permissions:
  contents: read

concurrency:
  group: v3-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-v3/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        run: npm run build
